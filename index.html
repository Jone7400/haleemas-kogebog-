<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7eee8"><title>Haleemas Kogebog</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#49372f;background:#faf5f0}*{box-sizing:border-box}body{margin:0}header{padding:28px 20px;background:#f3e2dd;text-align:center}h1{font-family:Georgia,serif;margin:0;font-size:32px}header p{margin:8px 0;color:#856d66}main{max-width:850px;margin:auto;padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}button,input,textarea,select{font:inherit;border-radius:12px;border:1px solid #dec9c1;padding:12px}button{background:#a85f6e;color:white;border:0;cursor:pointer}button.secondary{background:#ead9d2;color:#543b38}input[type=search]{flex:1;min-width:170px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px}.recipe{background:white;border-radius:18px;overflow:hidden;box-shadow:0 3px 15px #6a43301a;cursor:pointer}.recipe img,.placeholder{width:100%;height:155px;object-fit:cover;background:#ebd8ce;display:grid;place-items:center;font-size:45px}.recipe .info{padding:12px}.recipe h3{margin:0 0 6px;font-family:Georgia,serif}.muted{color:#88756d;font-size:13px}dialog{border:0;border-radius:20px;width:min(94vw,600px);max-height:90vh;overflow:auto;padding:22px;color:inherit}dialog::backdrop{background:#3328229c}form{display:grid;gap:12px}label{display:grid;gap:5px;font-weight:600}textarea{min-height:110px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.detail-image{width:100%;max-height:280px;object-fit:cover;border-radius:12px}pre{font:inherit;white-space:pre-wrap;line-height:1.6}#empty{text-align:center;padding:45px 12px;color:#92776c}footer{text-align:center;padding:28px;font-size:12px;color:#8c7971}</style></head><body><header><h1>♡ Haleemas Kogebog</h1><p>En lille samling af store smagsoplevelser</p></header><main><div class="toolbar"><input id="search" type="search" placeholder="Søg efter en opskrift…"><select id="filter"><option value="">Alle kategorier</option><option>Morgenmad</option><option>Frokost</option><option>Aftensmad</option><option>Dessert</option><option>Bagværk</option><option>Andet</option></select><button id="add">+ Ny opskrift</button><button id="random" class="secondary">🎲 Overrask mig</button></div><div id="grid"></div><p id="empty" hidden>Her er endnu ingen opskrifter ♡<br>Tryk på “Ny opskrift” for at begynde.</p></main><footer>Skabt med kærlighed ♡ · Opskrifter gemmes på denne enhed</footer><dialog id="editor"><form id="form"><h2 id="formtitle">Ny opskrift</h2><input type="hidden" id="id"><label>Rettens navn<input id="name" required maxlength="100" placeholder="F.eks. Haleemas pasta"></label><label>Kategori<select id="category"><option>Aftensmad</option><option>Morgenmad</option><option>Frokost</option><option>Dessert</option><option>Bagværk</option><option>Andet</option></select></label><label>Ingredienser (én pr. linje)<textarea id="ingredients" required placeholder="200 g pasta&#10;2 tomater"></textarea></label><label>Sådan tilberedes retten<textarea id="steps" required placeholder="1. Kog pastaen…"></textarea></label><label>Billede af retten<input id="photo" type="file" accept="image/*" capture="environment"></label><img id="preview" style="display:none;max-width:100%;max-height:180px;object-fit:contain" alt="Billedvisning"><div class="actions"><button type="submit">Gem opskrift</button><button type="button" class="secondary" id="cancel">Annuller</button></div></form></dialog><dialog id="viewer"><div id="detail"></div><div class="actions"><button id="edit">Rediger</button><button id="favorite" class="secondary">♡ Favorit</button><button id="delete" class="secondary">Slet</button><button id="close" class="secondary">Luk</button></div></dialog><script>
const KEY='haleemas-kogebog-v1';let recipes=[];let selected=null;let imageData='';const $=id=>document.getElementById(id);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{recipes=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{recipes=[]}function save(){try{localStorage.setItem(KEY,JSON.stringify(recipes));return true}catch{alert('Kunne ikke gemme. Billedet fylder måske for meget, eller lagerpladsen er fuld.');return false}}function render(){let q=$('search').value.toLowerCase(),cat=$('filter').value;let found=recipes.filter(r=>(r.name+' '+r.ingredients).toLowerCase().includes(q)&&(!cat||r.category===cat));$('grid').innerHTML=found.map(r=>`<article class="recipe" data-id="${escapeHTML(r.id)}">${r.image?`<img src="${r.image}" alt="${escapeHTML(r.name)}">`:'<div class="placeholder">🍲</div>'}<div class="info"><h3>${escapeHTML(r.name)} ${r.favorite?'♥':''}</h3><span class="muted">${escapeHTML(r.category)}</span></div></article>`).join('');$('empty').hidden=found.length>0;$('empty').textContent=recipes.length?'Ingen opskrifter matcher din søgning.':'Her er endnu ingen opskrifter ♡ Tryk på “Ny opskrift” for at begynde.'}function newRecipe(r){$('form').reset();$('id').value=r?.id||'';$('name').value=r?.name||'';$('category').value=r?.category||'Aftensmad';$('ingredients').value=r?.ingredients||'';$('steps').value=r?.steps||'';imageData=r?.image||'';$('preview').src=imageData;$('preview').style.display=imageData?'block':'none';$('formtitle').textContent=r?'Rediger opskrift':'Ny opskrift';$('editor').showModal()}$('add').onclick=()=>newRecipe();$('cancel').onclick=()=>$('editor').close();$('photo').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let bitmap=await createImageBitmap(file),scale=Math.min(1,1100/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);imageData=canvas.toDataURL('image/jpeg',.72);bitmap.close();$('preview').src=imageData;$('preview').style.display='block'}catch{alert('Billedet kunne ikke indlæses. Prøv et andet billede.')}};$('form').onsubmit=e=>{e.preventDefault();let id=$('id').value,old=recipes.find(r=>r.id===id);let r={id:id||crypto.randomUUID(),name:$('name').value.trim(),category:$('category').value,ingredients:$('ingredients').value.trim(),steps:$('steps').value.trim(),image:imageData,favorite:old?.favorite||false};let before=[...recipes];recipes=id?recipes.map(x=>x.id===id?r:x):[r,...recipes];if(save()){$('editor').close();render()}else recipes=before};function openRecipe(id){selected=id;let r=recipes.find(x=>x.id===id);if(!r)return;$('detail').innerHTML=`${r.image?`<img class="detail-image" src="${r.image}" alt="${escapeHTML(r.name)}">`:''}<h2>${escapeHTML(r.name)}</h2><p class="muted">${escapeHTML(r.category)}</p><h3>Ingredienser</h3><pre>${escapeHTML(r.ingredients)}</pre><h3>Tilberedning</h3><pre>${escapeHTML(r.steps)}</pre>`;$('favorite').textContent=r.favorite?'♥ Favorit':'♡ Favorit';$('viewer').showModal()}$('grid').onclick=e=>{let card=e.target.closest('[data-id]');if(card)openRecipe(card.dataset.id)};$('close').onclick=()=>$('viewer').close();$('edit').onclick=()=>{let r=recipes.find(x=>x.id===selected);$('viewer').close();newRecipe(r)};$('favorite').onclick=()=>{let r=recipes.find(x=>x.id===selected);if(!r)return;r.favorite=!r.favorite;save();$('favorite').textContent=r.favorite?'♥ Favorit':'♡ Favorit';render()};$('delete').onclick=()=>{if(!confirm('Vil du slette denne opskrift?'))return;recipes=recipes.filter(r=>r.id!==selected);save();$('viewer').close();render()};$('random').onclick=()=>{let found=recipes;if(!found.length)return alert('Opret først en opskrift ♡');openRecipe(found[Math.floor(Math.random()*found.length)].id)};$('search').oninput=render;$('filter').onchange=render;render();
</script></body></html>
